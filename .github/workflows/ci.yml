name: ci

on:
  push:
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: daemonarium/rpc-cpp
          ref: v0.1.0
          path: extern/rpc-cpp
      - uses: actions/checkout@v4
        with:
          repository: daemonarium/reflection-toolchain
          ref: v0.1.0
          path: reflection-toolchain
      - uses: actions/cache@v4
        id: sysroot
        with:
          path: reflection-toolchain/sysroot
          key: sysroot-v0.1.0-${{ hashFiles('reflection-toolchain/upstream-commits.txt') }}
      - name: Build sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        working-directory: reflection-toolchain
        run: ./build-sysroot.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts-test/package-lock.json
      - name: Configure and build
        env:
          P2996_COMPILER_SYSROOT: ${{ github.workspace }}/reflection-toolchain/sysroot
        run: |
          cmake -B build-web -S . \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/reflection-toolchain/toolchain/emscripten-p2996-toolchain.cmake" \
            -DWASM=ON
          cmake --build build-web --target debug-store
      - name: Host harness
        working-directory: ts-test
        run: |
          npm ci
          npm test
